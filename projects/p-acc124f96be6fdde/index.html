<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>teacher-desktop-prototype · 原型评审</title>
        <style>
            :root {
                --bg: #f7f8f8;
                --surface: #fff;
                --alt: #f1f2f4;
                --border: #d8dee3;
                --note-divider: color-mix(in srgb, var(--border) 60%, var(--surface));
                --text: #1a1d23;
                --muted: #4e5560;
                --accent: #2563eb;
                --soft: #eef2ff;
                --control: #808790;
                --on-accent: #fff;
                --font: 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
                --left: 224px;
                --right: 400px;
            }
            * { box-sizing: border-box; }
            @media (prefers-color-scheme: dark) { :root { --bg:#0b0d10;--surface:#121519;--alt:#1a1e23;--border:#363c44;--text:#f2f4f7;--muted:#a8b0ba;--accent:#7ba2ff;--soft:#1b2946;--control:#7e8795;--on-accent:#0b0d10;color-scheme:dark; } }
            /* 文字颜色：正文存浅色 token，暗底按 DESIGN_MASTER 暗色对应色映射（与工作台 proto-markdown.css 同一张表） */
            @media (prefers-color-scheme: dark) {
                [style="color:#b42318"] { color: #ff8a8a !important; } [style="color:#b45309"] { color: #f0a35e !important; } [style="color:#046c4e"] { color: #5fd39b !important; }
                [style="color:#1d4ed8"] { color: #7ba2ff !important; } [style="color:#0f766e"] { color: #4fd1c5 !important; } [style="color:#626b78"] { color: #a8b0ba !important; }
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font: 14px/1.7 var(--font);
                height: 100vh;
                overflow: hidden;
                letter-spacing: .02em;
                display: flex;
                flex-direction: column;
            }
            .brand { width:32px;height:32px;padding:6px;border-radius:6px;background:var(--accent);color:var(--on-accent);flex:none; }
            svg { width:18px;height:18px;vertical-align:middle; }
            .brand svg { width:20px;height:20px; }
            button {
                min-height: 32px;
                font: inherit;
                color: inherit;
                border: 1px solid var(--control);
                border-radius: 6px;
                background: var(--surface);
                padding: 5px 10px;
                cursor: pointer;
                white-space: nowrap;
            }
            button:hover { background: var(--alt); }
            button:focus-visible,
            a:focus-visible,
            .note:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
            header.topbar {
                height: 56px;
                flex: none;
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 0 20px;
                border-bottom: 1px solid var(--border);
                background: var(--surface);
            }
            .topbar strong { flex: 1; }
            .topbar #scope { max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
            .muted { color: var(--muted); font-size: 12px; }
            #source { color:var(--muted);text-decoration:none;font-size:12px;white-space:nowrap; }
            #source:hover { color: var(--accent); }
            .layout {
                display: grid;
                grid-template-columns: var(--left) minmax(0, 1fr) var(--right);
                flex: 1;
                min-height: 0;
            }
            .layout.left-closed { --left: 40px; }
            .layout.right-closed { --right: 0px; }
            .layout.prd-empty { grid-template-columns: var(--left) minmax(0, 1fr) 0; }
            .left-closed #tree { display: none; }
            .right-closed aside, .prd-empty aside { display: none; }
            nav {
                overflow: auto;
                border-right: 1px solid var(--border);
                background: var(--surface);
            }
            nav > button { border: 0; width: 100%; padding: 12px; }
            .canvas { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
            iframe { border: 0; width: 100%; flex: 1; background: var(--surface); }
            aside {
                position: relative;
                background: var(--surface);
                overflow: auto;
                border-left: 1px solid var(--border);
                padding: 12px 16px 16px;
            }
            /* PRD 区左缘保留透明拖动区域。 */
            #prd-resizer { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; margin-left: -5px; cursor: ew-resize; touch-action: none; z-index: 6; }
            .right-closed #prd-resizer, .prd-empty #prd-resizer { display: none; }
            aside h2 { font-size: 17px; margin: 0 0 4px; }
            details { border-bottom: 1px solid var(--border); padding: 7px 0; }
            details:last-of-type { border-bottom: 0; }
            summary { font-weight: 600; cursor: pointer; line-height: 1.5; }
            details[open] > summary { margin-bottom: 6px; }
            summary:focus-visible { outline:2px solid var(--accent);outline-offset:2px; }
            .markdown { overflow-wrap: anywhere; }
            .markdown h1 { font-size: 20px; }
            .markdown h2 { font-size: 17px; }
            .markdown h3 { font-size: 15px; }
            .markdown h4 { font-size: 14px; }
            .markdown :is(h1,h2,h3,h4) { margin: 12px 0 6px; line-height: 1.55; }
            .markdown p { margin: 0; } /* 与工作台同口径：Enter 换段与自然折行间距一致 */
            .markdown > :first-child { margin-top: 0; }
            .markdown > :last-child { margin-bottom: 0; }
            .markdown pre { white-space: pre-wrap; background: var(--alt); padding: 10px; border-radius: 6px; }
            .markdown code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; background: var(--alt); padding: 1px 5px; border-radius: 4px; }
            .markdown pre code { background: none; padding: 0; }
            .markdown table { border-collapse: collapse; width: 100%; }
            .markdown th, .markdown td { border: 1px solid var(--border); padding: 6px; text-align: left; }
            .markdown blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
            .markdown ul, .markdown ol { padding-left: 22px; }
            .markdown li.task { list-style: none; margin-left: -20px; }
            .markdown a { color: var(--accent); }
            .markdown hr { border: 0; border-top: 1px solid var(--border); }
            .note { display: block; border-bottom: 1px dashed var(--note-divider); padding: 14px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; }
            .note:hover { background: var(--alt); }
            /* 与操作台右栏同式：序号单独首行，正文另起一行（预览与导出一致） */
            .note-head { display: flex; align-items: center; margin-bottom: 8px; }
            .note-no { min-width: 20px; height: 20px; margin: 0; padding: 0 5px; border-radius: 50% 50% 50% 4px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
            .note.stale .note-no { background: var(--muted); }
            .note-no { --pin-custom-ink: #191919; }
            .note:not(.stale) .note-no { background: var(--pin-fill,var(--accent)); color: var(--pin-ink,var(--on-accent)); }
            .markdown img { display: block; max-width: 100%; height: auto; margin: 8px 0; border-radius: 6px; }
            .note .markdown { font-size: 14px; }
            .note .markdown > :first-child { margin-top: 0; }
            .note .markdown > :last-child { margin-bottom: 0; }
            .note.stale { opacity: .55; cursor: default; }
            .note.flash { animation: note-flash 1.2s ease; }
            .note.selected .note-head { background: var(--soft); border-radius: 6px; box-shadow: 0 0 0 4px var(--soft); }
            .note.selected .note-no { outline: 2px solid var(--accent); outline-offset: 3px; }
            @keyframes note-flash { 0%, 45% { background: var(--soft); } 100% { background: transparent; } }
            .empty { margin: 40px; padding: 24px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
            [hidden] { display: none !important; }
            @media (max-width: 1100px) {
                :root { --left: 180px; --right: 320px; }
                .topbar .muted { display: none; }
            }
        </style>

            if (Number.isFinite(saved) && saved >= min) preferred = Math.min(480, saved);
        } catch (_) { /* 存储不可用时仍可调整 */ }

            options.setWidth(width);
            handle.setAttribute('aria-valuemin', min);
            handle.setAttribute('aria-valuemax', Math.floor(max()));

            handle.setAttribute('aria-valuetext', `${width} 像素`);
        }
        function save() {

        }

ult", "title": "默认页面", "kind": "default"}], "parentId": "club-info", "clientId": "teacher-desktop", "role": "page", "previewType": "web"}, {"id": "club-history", "title": "社团历程", "file": "club-history.html", "states": [{"id": "default", "title": "默认页面", "kind": "default"}], "parentId": "club-info", "clientId": "teacher-desktop", "role": "page", "previewType": "web"}], "clients": [{"id": "teacher-desktop", "title": "教师桌面端", "previewType": "web"}], "defaultPage": "home", "documents": [{"id": "8aa930c5-8e64-4baa-91cf-6c791f6d3e20", "pageId": "basic-settings-edit", "stateId": "default", "markdown": "## 页面定位\n\n- 配置当前学期学生社团的通用规则，并在保存时统一校验合法性。\n- 时间、数量与活动规则的具体口径、校验及二次编辑影响，以对应页面标注为准。\n", "confirmed": false, "updatedAt": "2026-11-04T00:00:00.000000+00:00"}, {"id": "bd8740df-41a7-44c1-9201-164519eb7db7", "pageId": "home", "stateId": "club-info", "markdown": "## 需求目标\n\n- 让教师在不替代学生日常运营的前提下，查看社团当前运行事实、原始申报信息和学校日常安排。", "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "8d8c7025-cdb6-491e-8108-afb39c58e1c0", "pageId": "home", "stateId": "club-members", "markdown": "## 需求目标\n\n- 让教师查看当前有效成员关系和待社长审核情况，并只在例外处理中维护正式成员关系。", "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "196e84c4-518f-45b7-add9-c8278089f205", "pageId": "home", "stateId": "club-credits", "markdown": "## 需求目标\n\n- 在社团详情中查看成员本学期学分申请和认定事实，不在此页替代独立审核工作台。", "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "90c377ae-a4d2-4da3-93ed-e61e437fb9b5", "pageId": "home", "stateId": "club-history", "markdown": "## 需求目标\n\n- 以简洁时间线呈现影响社团身份或学期存续的关键事实，而不是无差别操作日志。", "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "f50019b0-119d-4bd7-a5bb-bffe82c5206c", "pageId": "club-info", "stateId": "default", "markdown": "## 页面职责\n\n- 呈现本学期社团的当前运行事实、原始申报信息与学校日常安排；教师在此支持和监督，不替代学生日常运营。\n\n## 核心规则\n\n- 当前信息与申报快照分开：当前学生社长、联系电话、类别、来源和日常场地按当前值展示；原始申报内容只读留存。\n- 学生日常场地需求与教师学校日常安排分别保存；每场活动的实际场地以活动发布记录为准。\n- 社团状态决定可见操作：进行中可提前结束；已提前结束可恢复；本学期已结束且存在目标学期时可延续。\n", "confirmed": false, "updatedAt": "2026-11-02T10:48:21.077882+00:00"}, {"id": "eec948de-e921-4247-b12e-55cc0dcd64ec", "pageId": "club-members", "stateId": "default", "markdown": "## 页面职责\n\n- 查看当前有效成员关系与待社长审核报名；教师仅在例外场景维护正式成员关系。\n\n## 核心规则\n\n- 当前名册不展示已移出成员；成员变更保留提出方、依据、处理人、时间与结果，既有活动、签到、学分事实不因移出而删除。\n- 教师添加只承接线下已经确认的成员，来源记录为“教师添加”，不伪造社长审核。\n- 仅在社团进行中且有剩余名额时允许添加；学生社长不在本页被移出。\n", "confirmed": false, "updatedAt": "2026-11-02T10:48:21.077882+00:00"}, {"id": "10b61da1-9a3e-4498-9a87-2b78f198a434", "pageId": "club-credits", "stateId": "default", "markdown": "## 页面职责\n\n- 查看成员在本学期的学分申请与认定事实；具体审核仍在独立的社团学分审核工作台完成。\n\n## 核心规则\n\n- 团员申请先由社长初审，再由教师终审；学生社长申请直接由教师审核。\n- 学时分别展示申报、社长核定和教师核定；已移出成员如已有申请或认定事实仍保留记录并标记。\n- 本页不新增审核快捷入口，避免把查看详情与审核任务混合。\n", "confirmed": false, "updatedAt": "2026-11-02T10:48:21.077882+00:00"}, {"id": "a895bf9e-ba3b-42bb-81e4-c2dc8ce51cf3", "pageId": "club-history", "stateId": "default", "markdown": "## 页面职责\n\n- 按倒序时间线展示影响社团身份、学期存续和来源关系的关键事实，而非无差别操作日志。\n\n## 核心规则\n\n- 仅记录首次成立／申报审核通过、延续至本学期、提前结束、恢复运行、学期结束／归档。未通过或退回申报、删除均不生成历程。\n- 成员、名额、日常场地等各自在所属对象留痕；活动、作品、荣誉和学分审核不进入本时间线。\n", "confirmed": false, "updatedAt": "2026-11-02T10:48:21.077882+00:00"}, {"id": "25b46954-61f4-44e4-ba00-f83ba59260cc", "pageId": "home", "stateId": "default", "markdown": "## 页面定位\n\n- 展示所选学期已成立的正式社团及其运行事实；申报记录、待审核申请不进入此列表。\n- 教师从此进入社团详情、专项审核、分析和配置，不代替学生社长日常运营。\n\n## 边界\n\n- 无对应专项权限时不显示审核、配置等入口。\n", "confirmed": false, "updatedAt": "2026-11-04T08:54:28.904Z"}, {"id": "f5560ffb-a5ed-435e-9044-aa24bbfa486e", "pageId": "basic-settings", "stateId": "default", "markdown": "## 页面职责\n\n- 查看当前学期已经生效的社团通用设置；不在本页解释或修改具体规则。\n- 通过“编辑”进入独立编辑页，保存后的结果回到本页作为当前生效值展示。\n\n## 查看范围\n\n- 时间设置、数量设置、活动与开展规则仅展示当前配置摘要。\n- 历史业务记录不因后续调整而改写；具体规则、校验与生效边界见编辑页需求标注。\n", "confirmed": false, "updatedAt": "2026-11-03T08:43:41.506215+00:00"}, {"id": "fc128561-d2fb-4267-b537-16e834156d5e", "pageId": "activity-notice", "stateId": "default", "markdown": "## 页面职责\n\n- 维护学生在“社团申报”入口可主动查看的申报说明、材料指引和咨询信息；它是说明内容，不替代正式申报表或审核规则。\n\n## 展示与编辑\n\n- 展示开关关闭后，学生端不显示说明入口；已保存的说明内容保留，重新开启后按最新已保存版本展示。\n- 开启展示时可编辑标题、正文和附件；正文可包含咨询方式、时间提醒和材料说明。\n- 学生阅读说明不构成已知悉、已同意或已提交申报的业务事实，不应以强制弹窗阻断创建流程。\n\n## 边界\n\n- 哪些附件类型、大小、发布审批和历史版本需要支持，待确认。\n- 说明不得绕过基本设置的申报时间、表单必填和审核规则。", "confirmed": false, "updatedAt": "2026-11-03T08:43:41.506215+00:00"}, {"id": "c56ba9f2-acbd-45cf-9b1c-838cfdcf1e09", "pageId": "form-settings", "stateId": "default", "markdown": "## 页面职责\n\n- 配置学生社团业务中由学校决定的补充填写内容，并提供社团申报表、学分申请表、活动开展材料三个对象的查看与设置入口。\n\n## 表单规则\n\n- 系统固定字段与学校扩展字段必须区分展示；固定的业务对象、身份、申报学时等核心信息不能被学校配置删除。\n- 修改只影响后续新建或重新提交；已提交记录按当时表单版本保留，不能因配置变更而丢失字段或改变历史校验。\n- 查看表单展示学生实际填写视角；设置页承接字段标题、提示、必填、附件等配置，复杂校验单独在该设置状态标注。\n\n## 边界\n\n- 各表单的完整固定字段、可配置组件、附件格式与大小、版本生效时点仍需逐项确认。", "confirmed": false, "updatedAt": "2026-11-03T08:43:41.506215+00:00"}, {"id": "60d80b62-7464-446f-acf1-5b761237b049", "pageId": "category-settings", "stateId": "default", "markdown": "## 页面职责\n\n- 管理学生申报时可选择的社团类别，并将类别作为后续列表筛选、统计和申报审核路由的共同数据源。\n\n## 字段与规则\n\n| 字段 | 规则 |\n|---|---|\n| 类别名称 | 同一学校／适用范围内不得重复；名称长度、停用与排序规则待确认。 |\n| 已关联社团 | 展示当前关联数量，用于删除前判断影响，不等于类别状态。 |\n| 申报审核老师 | 已配置时优先路由给对应老师；未配置时按学校集中审核规则处理。 |\n\n- 删除类别不改写已有社团及其历史申报；只使后续新申报不可再选择该类别。若存在待审核申报、有效方案或其他关联限制，应在正式规则中明确是否允许删除与如何拦截。\n\n## 边界\n\n- 类别适用学段、校区、学期、审核多级流转和教师权限范围待确认。", "confirmed": false, "updatedAt": "2026-11-03T08:43:41.506215+00:00"}, {"id": "2c85bb39-530c-48b1-ae80-5f6f1ffbf3a2", "pageId": "credit-rules", "stateId": "default", "markdown": "## 页面职责\n\n- 设置教师终审时用于实时计算建议学分的换算规则；规则基于核定学时，不替代教师的最终认定和留痕。\n\n## 规则与数据\n\n- 团长、团员可配置不同规则；系统以该学生的身份及核定学时匹配规则，展示建议结果。\n- 修改只影响后续提交或认定；已完成的学分认定必须保留当时采用的规则版本与结果。\n- 申请说明、证明材料等属于学分申请表配置，不应混入换算规则页。\n\n## 待确认\n\n- 当前原型中的“满 X 小时得 X 学分、超出后递增、最高封顶”来自 1.0 界面证据，尚非最终确认的标准公式。\n- 规则适用范围、有效期／版本、精度、负值或零值校验、教师调整后的解释与展示口径待确认。", "confirmed": false, "updatedAt": "2026-11-03T08:43:41.506215+00:00"}, {"id": "56da9592-b13a-4d49-a3ac-4bdb5ae3501d", "pageId": "club-activities", "stateId": "default", "markdown": "## 页面职责\n\n- 按单场活动核对时间、场地、出勤与活动记录等客观过程事实；教师默认查看。\n\n## 页面规则\n\n- 活动时间和场地取活动发布时的值；活动记录状态取社长提交结果。无系统记录不推断线下未开展，也不生成运行评价。\n- “活动瞬间”是社团级总览，可按所属活动筛选；内容由成员在活动下自主分享，仅社团成员可见，教师仅作了解，不直接折算学时。\n- 单场活动详情承接活动信息、考勤和活动记录；瞬间不与这些事实并列在同一抽屉。活动是否存在报名、审核等参与机制仍待确认。\n", "confirmed": false}, {"id": "5a92c9c9-a243-48f5-8631-9deb88e8b5f8", "pageId": "club-showcase", "stateId": "default", "markdown": "## 页面职责\n\n- 查看社团维度持续维护的作品集锦和荣誉时刻，不按学期拆分，也不混入活动过程记录。\n\n## 页面规则\n\n- 两类内容由学生社长上传和维护，面向全体学生公开；作品必须展示实际创作成员，社长不是作品作者的默认替代者。\n- 荣誉展示名称、获得时间和上传时间；作品展示名称、创作成员、说明与上传时间。视频类型只用于播放标识，不额外显示类型标签。\n- 教师默认查看，不因学生上传增加逐项日常审核；下架、恢复、举报和内容限制规则待确认。\n", "confirmed": false}], "annotations": [{"id": "a101cf10-6faa-401f-8c4f-b0d1c05d1e30", "pageId": "home", "stateId": "club-info", "number": 1, "body": "### 页面显示\n\n- 当前情况仅展示成员与名额、活动记录、待社长审核的入团申请三项运行事实；活动无记录时显示“暂无活动记录”，不据此评价社团运行质量。\n\n### 业务规则\n\n- 人数上限仅支持有管理权限的教师扩大，调整值必须大于当前上限；不支持缩减、不要求调整原因，也不建设单独的名额调整记录。", "anchor": {"protoId": "club-info-overview", "selector": "[data-proto-id=\"club-info-overview\"]", "tag": "section", "text": "当前情况"}, "placement": {"kind": "element", "x": 0, "y": 0, "rx": 0, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "afc8e78e-c555-491d-8e6c-d9f4b9d11f02", "pageId": "home", "stateId": "club-info", "number": 2, "body": "### 页面显示\n\n- 固定展示社团类别、社团来源、当前学生社长及联系电话；学生社长同时展示姓名和年级，顶部上下文另展示行政班级。", "anchor": {"protoId": "club-info-basics", "selector": "[data-proto-id=\"club-info-basics\"]", "tag": "section", "text": "基本信息"}, "placement": {"kind": "element", "x": 0, "y": 0, "rx": 0, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "3ae98688-3d64-4682-b9ed-6eca53dc23cb", "pageId": "home", "stateId": "club-info", "number": 3, "body": "### 业务规则\n\n- 学生申报的拟用场地、场地说明与教师的学校日常安排分别保留；教师只可调整学校日常安排，不改写学生原始输入，也不把日常安排当作单场活动的实际场地。", "anchor": {"protoId": "club-info-venue", "selector": "[data-proto-id=\"club-info-venue\"]", "tag": "section", "text": "活动场地"}, "placement": {"kind": "element", "x": 0, "y": 0, "rx": 0, "ry": 0.5}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-02T09:58:08.248769+00:00"}, {"id": "0ee1897c-ac44-463f-8277-9af0cc58ff05", "pageId": "home", "stateId": "club-info", "number": 4, "body": "### 交互说明\n\n1. 点击“查看本学期申报资料”后，以只读快照查看本学期提交与审核时的申报内容；快照不因当前信息调整而改写。", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(2) > section:nth-of-type(2) > div:nth-of-type(1)", "tag": "div", "text": "基本信息 查看本学期申报资料", "parentText": "基本信息 查看本学期申报资料 社团类别 文史学院 社团来源 从上学期延续 学生社长 赵晨 · 八年级 联系电话 188 3333 1026 社团介绍 面向对围棋感兴趣的同学，开展棋艺交流、对弈复盘与校园棋类活动。 活动场地 学生申报 原始内容 拟用场地 图书馆研讨室 教师日常安排 可调整 图书馆研讨室 调整场地 实际场地以活动记录为准", "htmlSnippet": "<div class=\"club-detail-section-head\"><h3>基本信息<\/h3><button type=\"button\" class=\"club-view-action\" data-proto-id=\"club-info-application-snapshot\">查看本学期申报资料<\/button><\/div>", "rect": {"x": 266, "y": 529, "width": 921, "height": 32}, "conditions": [{"selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(1) > button:nth-of-type(1)", "kind": "aria-selected", "value": "true", "option": "社团信息", "label": "", "explicit": false}]}, "placement": {"kind": "element", "x": 795.1500000000001, "y": -0.5154999999999745, "rx": 0.863355048859935, "ry": 0}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-02T10:57:40.335Z"}, {"id": "54c187ad-2873-48ea-b7fc-a09e1c8a0e05", "pageId": "home", "stateId": "club-members", "number": 1, "body": "### 页面显示\n\n- 概况只显示当前有效成员数及待社长审核人数，不重复展示名额上限，也不设置“成员名册”标题或“当前学期已确认成员关系”等说明。", "anchor": {"protoId": "member-management", "selector": "#root > div > main > section > div:nth-of-type(2) > section > div:nth-of-type(2) > section", "tag": "section", "text": "当前 3 人 3 人待社长审核 查看变更记录 导入成员 添加成员 学生 年级 班级 身份 成员来源 加入时间 操作 赵晨 八年级 （3）班 学生社长 社团申报通过 2026-02-25 16:20 — 王嘉宁 八年级 （5）班 团员 自主报名 2026-09-13 19:22 移出成员 李沐阳 七年级 （2）班 团员 教师 acement": {"kind": "element", "x": 97.93, "y": 21.589999999999975, "rx": 0.5551636476371851, "ry": 0.4906818181818176}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T09:44:36.720Z"}, {"id": "173dd8e8-2751-4699-9af6-cd9b9ae83c00", "pageId": "home", "stateId": "default", "number": 5, "body": "### 代学生申报\n\n- 这是次级入口；教师代填必须指定学生社长，不产生教师本人负责的社团。\n- <span style=\"color:#ec4954\">是否自动通过取决于代申报权限、审核权限和全部提交校验，不能因代填而默认跳过审核。<\/span>\n", "anchor": {"protoId": "clubs-proxy-application"}, "placement": {"kind": "element", "x": 0, "y": 0, "rx": 0, "ry": 0}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-03T10:03:02.092Z"}, {"id": "f6a97e8e-4b5f-47a6-a4bb-92adcd5fc713", "pageId": "home", "stateId": "default", "number": 6, "body": "### 行操作\n\n- 固定“查看＋更多”；查看进入独立社团详情。\n- 当前学期进行中且具备目标学期、权限、无重复延续记录时可延续或提前结束；已提前结束只可恢复或删除，进行中不可删除。", "anchor": {"protoId": "clubs-row-actions-1"}, "placement": {"kind": "element", "x": 0, "y": 0, "rx": 0, "ry": 0}, "offset": {"x": 20, "y": 0}, "collapsed": false, "confirmed": false, "updatedAt": "2026-11-04T07:33:31.778Z"}, {"id": "d7d18a0d-82a5-4263-a1c6-6e2d54cad506", "pageId": "basic-settings-edit", "stateId": "default", "number": 2, "body": "## 数量设置\n\n### 信息\n\n| 设置项 | 可设置值 | 适用范围 |\n|---|---|---|\n| 每名学生最多发起社团数 | 正整数或不限数量 | 当前学期，学生发起新社团申报 |\n| 每名学生最多加入社团数 | 正整数或不限数量 | 当前学期，学生申请加入和社长确认成员 |\n\n### 业务逻辑\n\n| 设置项 | 校验时点 | 计数口径 |\n|---|---|---|\n| 最多发起社团数 | 提交新的社团申报时 | 按学生、按当前学期计算；同一申报被退回后修改或重新提交，仍只计为一次。 |\n| 最多加入社团数 | 提交入团申请时、社长确认成员时 | 两个时点均校验；以当前学期已生效的成员关系为准，确认成员前须再次校验。 |\n\n### 校验\n\n- 设置数量时只能填写大于 0 的整数；选择“不限数量”后不再填写具体数值。\n- 达到上限时，学生不能再提交对应的新申请；社长确认成员时若该学生已达到加入上限，不能确认。\n\n### 异常说明\n\n- 已达到上限后调低数量，不自动撤销既有申报或移出既有成员；后续新申请和成员确认按调整后的数量校验。\n- 教师按权限进行例外成员调整时，必须记录调整人、调整时间和调整原因。", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > div", "tag": "div", "text": "建议在社团开放前确认本学期设置。已开始的业务仍按原设置办理。 时间设置 分别设置各项社团业务的开放时间；如不限制具体时间，可直接勾选“不限时间”。 社团申报时间 不限时间 学生发起并提交新社团申报的时间窗口 入团报名时间 不限时间 学生可在此期间报名；申请未通过时，也可重新报名。结束后不再接受新的申请。 成员名单确认截止时间 不设截止时间 社长须在此时间前审核已提交的申请并确认成员。截止后，未处理的申请自动失效，社长不再新增成员；教师可按权限调整成员并留痕。 学分申请时间 不限时间 学期末社长与成员提交社团学分申请的时间窗口 数量设置 控制学生在本学期可发起的社团数和可作为成员加入的社团数；达到上限后，不再允许提交对应的新申请。 每名学生最多发起社团数 不限数量 学生提交新社团申报时校验；对同一申报的退回修改或重新提交不重复计数。 每名学生最多加入社团数 不限数量 学生提交入团申请及社长确", "parentText": "建议在社团开放前确认本学期设置。已开始的业务仍按原设置办理。 时间设置 分别设置各项社团业务的开放时间；如不限制具体时间，可直接勾选“不限时间”。 社团申报时间 不限时间 学生发起并提交新社团申报的时间窗口 入团报名时间 不限时间 学生可在此期间报名；申请未通过时，也可重新报名。结束后不再接受新的申请。 成员名单确认截止时间 不设截止时间 社长须在此时间前审核已提交的申请并确认成员。截止后，未处理的申请自动失效，社长不再新增成员；教师可按权限调整成员并留痕。 学分申请时间 不限时间 学期末社长与成员提交社团学分申请的时间窗口 数量设置 控制学生在本学期可发起的社团数和可作为成员加入的社团数；达到上限后，不再允许提交对应的新申请。 每名学生最多发起社团数 不限数量 学生提交新社团申报时校验；对同一申报的退回修改或重新提交不重复计数。 每名学生最多加入社团数 不限数量 学生提交入团申请及社长确", "htmlSnippet": "<div class=\"settings-page\"><div class=\"settings-centered-container\"><div class=\"settings-effect-note\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"15\" height=\"15\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z\"><\/path><\/svg><span>建议在社团开放前确认本学期设置。已开始的业务仍按原设置办理。<\/span><\/div><div class=\"settings-cards-stack\"><section class=\"settings-card-module\" data-proto-id=\"basic-settings-time\"><div class=\"setting-card-header\"><div class=\"setting-card-title-wrap\"><span class=\"setting-card-icon\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM72,48v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80H48V48ZM208,208H48V96H208V208Z\"><\/path><\/svg><\/span><div class=\"setting-card-titles\"><div class=\"set 时间，属于重新开放；保存前须二次确认。\n- 把成员名单确认截止时间调至当前时间前，保存前须提示待处理申请将失效；已失效申请不自动恢复。\n", "anchor": {"protoId": "", "selector": "#root > div > main > section > div:nth-of-type(2) > div", "tag": "div", "text": "建议在学期社团开放前确认设置。后续修改只影响新产生的业务数据，不改写已形成的记录。 时间设置 分别设置各项社团业务的开放时间；如不限制具体时间，可直接勾选“不限时间”。 社团申报时间 不限时间 学生发起并提交新社团申报的时间窗口 入团报名时间 不限时间 学生可在此期间报名；申请未通过时，也可重新报名。结束后不再接受新的申请。 成员名单确认截止时间 不设截止时间 社长须在此时间前审核已提交的申请并确认成员。截止后，未处理的申请自动失效，社长不再新增成员；教师可按权限调整成员并留痕。 学分申请时间 不限时间 学期末社长与成员提交社团学分申请的时间窗口 数量设置 控制学生在本学期可发起的社团数和可作为成员加入的社团数；达到上限后，不再允许提交对应的新申请。 每名学生最多发起社团数 不限数量 个社团 学生提交新社团申报时校验；对同一申报的退回修改或重新提交不重复计数。 每名学生最多加入社团数 不限", "parentText": "建议在学期社团开放前确认设置。后续修改只影响新产生的业务数据，不改写已形成的记录。 时间设置 分别设置各项社团业务的开放时间；如不限制具体时间，可直接勾选“不限时间”。 社团申报时间 不限时间 学生发起并提交新社团申报的时间窗口 入团报名时间 不限时间 学生可在此期间报名；申请未通过时，也可重新报名。结束后不再接受新的申请。 成员名单确认截止时间 不设截止时间 社长须在此时间前审核已提交的申请并确认成员。截止后，未处理的申请自动失效，社长不再新增成员；教师可按权限调整成员并留痕。 学分申请时间 不限时间 学期末社长与成员提交社团学分申请的时间窗口 数量设置 控制学生在本学期可发起的社团数和可作为成员加入的社团数；达到上限后，不再允许提交对应的新申请。 每名学生最多发起社团数 不限数量 个社团 学生提交新社团申报时校验；对同一申报的退回修改或重新提交不重复计数。 每名学生最多加入社团数 不限", "htmlSnippet": "<div class=\"settings-page\"><div class=\"settings-centered-container\"><div class=\"settings-effect-note\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"15\" height=\"15\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a12,12,0,1,1,12,12A12,12,0,0,1,112,84Z\"><\/path><\/svg><span>建议在学期社团开放前确认设置。后续修改只影响新产生的业务数据，不改写已形成的记录。<\/span><\/div><div class=\"settings-cards-stack\"><section class=\"settings-card-module\" data-proto-id=\"basic-settings-time\"><div class=\"setting-card-header\"><div class=\"setting-card-title-wrap\"><span class=\"setting-card-icon\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" fill=\"currentColor\" viewBox=\"0 0 256 256\" aria-hidden=\"true\"><path d=\"M208,32H184V24a8,8,0             function inline(s) {
                const literals = [];
                const hold = html => { literals.push(html); return '\u0000' + (literals.length - 1) + '\u0000'; };
                return esc(s)
                    .replace(/`([^`]+)`/g, (m, code) => hold(`<code>${code}</code>`))
                    .replace(/!\[([^\]]*)\]\((prd-assets\/[a-f0-9]{64}\.(?:png|jpg|gif|webp))(?:\s+&quot;([^\n]*?)&quot;)?\)/g, (m, alt, path, title = '') => {
                        const size = /(?:^|\s)proto-width=(\d{1,4})$/.exec(title);
                        const width = size && +size[1] >= 48 && +size[1] <= 4096 ? ` width="${+size[1]}"` : '';
                        if (width) title = title.slice(0, size.index).trim();
                        const base=/^(?:proto\/|prototype-versions\/[a-f0-9]{24}\/)$/.test(data?.prototypeBase || '') ? data.prototypeBase : 'proto/';
                        return hold(`<img src="${esc(new URL(base + path, location.href).href)}" alt="${alt}"${width}${title ? ` title="${title}"` : ''} loading="lazy">`);
                    })
                    // 文字颜色：与工作台 safeHTML 同口径，只放行 <span style="color:…"> 这一种内联 HTML（色值限十六进制 / 颜色名）
                    .replace(/&lt;span style=&quot;color:(#[0-9a-fA-F]{3,8}|[a-zA-Z]+)&quot;&gt;/g, (m, c) => `<span style="color:${c.toLowerCase()}">`)
                    .replace(/&lt;\/span&gt;/g, '</span>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>')
                    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
                    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
                        /^(https?:|mailto:|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t)
                    .replace(/\u0000(\d+)\u0000/g, (m, index) => literals[+index]);
            }
            function md(src) {
                const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
                const out = [];
                let i = 0, para = [];
                const flushPara = () => {
                    if (para.length) { out.push(`<p>${para.map(inline).join('<br>')}</p>`); para = []; }
                };
                while (i < lines.length) {
                    const line = lines[i];
                    let m = line.match(/^```\w*\s*$/);
                    if (m) {
                        flushPara();
                        const buf = [];
                        i++;
                        while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
                        i++;
                        out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
                        continue;
                    }
                    if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
                        flushPara();
                        const parseRow = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
                        const head = parseRow(line);
                        i += 2;
                        const rows = [];
                        while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(parseRow(lines[i++]));
                        out.push(`<table><thead><tr>${head.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
                        continue;
                    }
                    m = line.match(/^(#{1,4})\s+(.*)$/);
                    if (m) { flushPara(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
                    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); out.push('<hr>'); i++; continue; }
                    if (/^>\s?/.test(line)) {
                        flushPara();
                        const buf = [];
                        while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
                        out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`);
                        continue;
                    }
                    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
                        flushPara();
                        const ordered = /^\s*\d+\./.test(line);
                        const itemRe = ordered ? /^\s*\d+\.\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/;
                        const items = [];
                        while (i < lines.length && itemRe.test(lines[i])) {
                            const t = lines[i].match(itemRe)[1];
                            i++;
                            const task = t.match(/^\[([ xX])\]\s+(.*)$/);
                            items.push(task
                                ? `<li class="task"><input type="checkbox" disabled${task[1] !== ' ' ? ' checked' : ''}> ${inline(task[2])}</li>`
                                : `<li>${inline(t)}</li>`);
                        }
                        out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
                        continue;
                    }
                    if (!line.trim()) { flushPara(); i++; continue; }
                    para.push(line);
                    i++;
                }
                flushPara();
                return out.join('\n');
            }

            // ---------- 数据与状态 ----------
            let data = null;
            try { data = JSON.parse($('review-data').textContent); } catch (_) { data = null; }
            const frame = $('frame');
            let current = { page: null, stateId: null };
            let orders = {};            // stateId -> { map: noteId -> displayNumber, stale: Set }
            let pendingState = null;    // 跨页切换时，等原型页报 ready 后再进入的状态
            let loadedFile = null;
            let frameReady = false;     // 当前 iframe 页已握手（收到 ready 且已下发 init）
            let projectNavigation = null;
            let selectedNoteId = null;
            let pendingPublicationTarget=PublicationUpdates.readTarget(location.hash);
            let publicationRequest=0;

            const safePath = (path) => {
                const parts = String(path || '').replace(/\\/g, '/').split('/');
                if (parts.some((p) => !p || p.startsWith('.') || p.includes(':'))) throw new Error('原型文件路径无效');
                return parts.map(encodeURIComponent).join('/');
            };
            function prototypeUrl(page) {
                const file = String(page.file || '').replace(/\\/g, '/');
                const base=/^(?:proto\/|prototype-versions\/[a-f0-9]{24}\/)$/.test(data.prototypeBase || '') ? data.prototypeBase : 'proto/';
                const path = base + safePath(file);
                const version = data.prototypeVersions?.[file];
                return typeof version === 'string' && /^[a-f0-9]{20}$/.test(version) ? path + '?v=' + version : path;
            }

            /* file:// 下 iframe 源为 opaque（'null'），targetOrigin 只能用 '*'；接收侧以 e.source === frame.contentWindow 校验。 */
            function post(msg) {
                try { frame.contentWindow?.postMessage(Object.assign({ __review: 1 }, msg), '*'); } catch (_) { /* iframe 未就绪 */ }
            }

            const canvas = document.querySelector('.canvas');
            let hotspotPointer = null;
            canvas.addEventListener('pointerdown', e => { hotspotPointer = { x: e.clientX, y: e.clientY, moved: false }; }, true);
            canvas.addEventListener('pointermove', e => {
                if (hotspotPointer && Math.hypot(e.clientX - hotspotPointer.x, e.clientY - hotspotPointer.y) > 8) hotspotPointer.moved = true;
            }, true);
            canvas.addEventListener('pointercancel', () => { hotspotPointer = null; }, true);
            canvas.addEventListener('click', e => {
                const drag = hotspotPointer?.moved; hotspotPointer = null;
                if (drag || !frameReady || e.defaultPrevented || e.button !== 0 || e.detail === 0 || e.target.closest('button,a,input,textarea,select,[contenteditable],[data-prototype-owned]') || String(getSelection()).trim()) return;
                post({ type: 'showHotspots' });
            });

            // ---------- 左栏页面树 ----------
            function buildTree() {
                const config={project:data,currentPage:current.page?.id,currentState:current.stateId,annotations:data.annotations,
                    onSelect:(id,state)=>selectPage(data.pages.find(p=>p.id===id),state)};
                if(projectNavigation)projectNavigation.update(config);
                else projectNavigation=ProtoProjectNavigation.mount($('tree'),config);
            }
            function treeButton(text, page, stateId) {
                const b = document.createElement('button');
                b.textContent = text;
                b.dataset.scope = page.id + '\n' + stateId;
                b.onclick = () => selectPage(page, stateId);
                return b;
            }

            // ---------- 页面 / 状态切换 ----------
            function selectPage(page, stateId) {
                if(pendingPublicationTarget?.pageId!==page.id)pendingPublicationTarget=null;
                const samePage = current.page?.id === page.id && loadedFile === page.file;
                if (current.page?.id !== page.id || current.stateId !== stateId) selectedNoteId = null;
                current = { page, stateId };
                buildTree();
                ProtoProjectNavigation.applyPreview(frame,page.states?.find(s=>s.id===stateId)?.previewType || page.previewType || data.clients?.find(c=>c.id===page.clientId)?.previewType || data.previewType || 'web');
                if (!samePage) orders = {};
                syncChrome();
                renderAside();
                if (samePage && frameReady) {
                    post({ type: 'enterState', stateId });
                    flushPublicationTarget();
                } else {
                    pendingState = stateId;
                    loadedFile = page.file;
                    frameReady = false;
                    frame.hidden = false;
                    $('empty').hidden = true;
                    frame.src = prototypeUrl(page);
                }
            }
            function syncChrome() {
                const { page, stateId } = current;
                const st = page.states?.find((s) => s.id === stateId);
                $('scope').textContent = (page.states?.length || 0) > 1 ? `${page.title} / ${st?.title || stateId}` : page.title;
                try { $('source').href = prototypeUrl(page); } catch (_) { $('source').removeAttribute('href'); }
                for (const b of $('tree').querySelectorAll('button'))
                    b.setAttribute('aria-current', String(b.dataset.scope === page.id + '\n' + stateId));
                history.replaceState(null, '', '#' + new URLSearchParams({ p: page.id, s: stateId }).toString());
            }

            // ---------- 原型页握手：页内 bridge 报 ready 后下发标注，跟随真实页面 / 状态 ----------
            const pageNotes = () => data.annotations
                .filter((n) => n.pageId === current.page.id)
                .map((n) => Object.assign({}, n, { bodyHtml: md((n.body || '').trim() ? n.body : '*（空标注）*') }));
            function onFrameReady(ids) {
                if (!current.page || !loadedFile) return;
                const actual = data.pages.find((p) => p.id === ids.pageId);
                if (actual && actual.id !== current.page.id) {
                    /* 原型内部导航到了另一个已登记页面：跟随。 */
                    current = { page: actual, stateId: actual.states.some((s) => s.id === ids.stateId) ? ids.stateId : actual.states[0].id };
                    selectedNoteId = null;
                    orders = {};
                    pendingState = null;
                    syncChrome();
                } else if (ids.stateId && ids.stateId !== current.stateId && current.page.states?.some((s) => s.id === ids.stateId)) {
                    current.stateId = ids.stateId;
                    selectedNoteId = null;
                    syncChrome();
                }
                let enterState = null;
                if (pendingState) {
                    if (pendingState !== (ids.stateId || 'default')) enterState = pendingState;
                    pendingState = null;
                }
                frameReady = true;
                // 先按当前页/状态判定 PRD 是否为空，再把真实侧栏开合态下发给 iframe；避免切页瞬间沿用上一页状态。
                renderAside();
                post({ type: 'init', notes: pageNotes(), asideOpen: prdAsideOpen(), enterState, selectedNoteId,
                    hintScopes: (current.page?.states || []).map(state => ({id: state.id, interactionHints: state.interactionHints})) });
                flushPublicationTarget();
            }
            window.addEventListener('message', (e) => {
                if (e.source === frame.contentWindow && e.data?.__protoScreenshot === 1 && e.data.type === 'navigate' && current.page?.kind === 'screenshot') {
                    const target = data.pages.find(p => p.id === e.data.pageId);
                    if(target) selectPage(target, target.states[0]?.id || 'default');
                    return;
                }
                if (e.source !== frame.contentWindow || !e.data || e.data.__review !== 1) return;
                const m = e.data;
                if (m.type === 'ready') { onFrameReady(m.ids || {}); return; }
                if (!frameReady) return;   // 握手前的空 sync 丢掉，免右栏闪一下“–”
                if (m.type === 'sync') onPinSync(m.map || {}, m.state || 'default', m.stale || []);
                else if (m.type === 'focus') onPinFocus(m.noteId);
                else if (m.type === 'selection') selectReviewNote(m.noteId);
                else if (m.type === 'changeLocated' && m.requestId===publicationRequest && !m.cancelled) PublicationUpdates.notify(m.message || (m.ok?'已定位更新位置':'目标暂不可定位'));
            });

            function flushPublicationTarget(){
                if(!pendingPublicationTarget || !frameReady)return;
                const target=pendingPublicationTarget;pendingPublicationTarget=null;
                if(target.documentId){document.querySelector('aside')?.scrollTo({top:0,behavior:'smooth'});PublicationUpdates.notify('已打开对应页面需求');return;}
                if(target.noteId)onPinFocus(target.noteId);
                post({type:'locateChange',target,requestId:++publicationRequest});
            }
            function locatePublicationTarget(target){
                const page=data.pages.find(p=>p.id===target.pageId);
                if(!page){PublicationUpdates.notify('该页面已删除，请查看变更详情');return;}
                const state=page.states?.some(s=>s.id===target.stateId)?target.stateId:page.states?.[0]?.id || 'default';
                pendingPublicationTarget={...target,stateId:state};selectPage(page,state);
            }

            // ---------- 气泡层回调 ----------
            function onPinSync(map, state, stale) {
                orders[state] = { map, stale: new Set(stale) };
                if (current.page && state !== current.stateId && current.page.states?.some((s) => s.id === state)) {
                    /* 原型自身切换了状态（页内交互）：右栏与页面树跟随。 */
                    current.stateId = state;
                    selectedNoteId = null;
                    syncChrome();
                }
                if (state === current.stateId) renderAside();
            }
            function onPinFocus(noteId) {
                selectReviewNote(noteId);
                const row = $('notes').querySelector(`[data-note-id="${CSS.escape(noteId)}"]`);
                if (!row) return;
                // 与 viewer extScrollNoteIntoView 同语义（单套同源）：定位行首（序号）进视口，行首已可见则不滚。
                // scrollIntoView({block:'nearest'}) 对「比滚动容器高且正覆盖视口」的长标注是规范 no-op，长文标注停在视口中部时点序号不滚动（2026-09-30 用户报障）。
                const sc = row.closest('aside');
                const top = row.getBoundingClientRect().top - sc.getBoundingClientRect().top;
                if (top < 0 || top >= sc.clientHeight) sc.scrollTo({ top: sc.scrollTop + top - 12, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
                row.classList.remove('flash');
                void row.offsetWidth;
                row.classList.add('flash');
            }
            function reveal(note) {
                // 定位在原型页内完成（review-bridge.js：目标被折叠隐藏时先联动展开再滚到位）
                selectReviewNote(note.id);
                post({ type: 'reveal', note });
            }
            function selectReviewNote(noteId) {
                selectedNoteId = data.annotations.some(n => n.id === noteId && n.pageId === current.page?.id && n.stateId === current.stateId) ? noteId : null;
                for (const row of $('notes').querySelectorAll('.note')) {
                    const selected = row.dataset.noteId === selectedNoteId;
                    row.classList.toggle('selected', selected);
                    row.setAttribute('aria-current', String(selected));
                }
                post({ type: 'select', noteId: selectedNoteId });
            }

            // ---------- 右栏 PRD ----------
            const prdAsideOpen = () => !$('layout').classList.contains('right-closed') && !$('layout').classList.contains('prd-empty');
            function renderAside() {
                const { page, stateId } = current;
                if (!page) return;
                const doc = data.documents.find((d) => d.pageId === page.id && d.stateId === stateId);
                const docHasContent = !!doc?.markdown?.trim();
                $('document-section').hidden = !docHasContent;
                $('document').innerHTML = docHasContent ? md(doc.markdown) : '';
                const notes = data.annotations.filter((n) => n.pageId === page.id && n.stateId === stateId);
                const notesHasContent = notes.length > 0;
                $('notes-section').hidden = !notesHasContent;
                $('notes-count').textContent = notesHasContent ? `（${notes.length}）` : '';
                const prdEmpty = !docHasContent && !notesHasContent;
                $('layout').classList.toggle('prd-empty', prdEmpty);
                $('toggle-prd').hidden = prdEmpty;
                // 切换页面时 renderAside 可能先于新 iframe 加载；只向当前已握手文件同步，避免把新页状态误发给旧 iframe。
                if (frameReady && current.page?.file === loadedFile)
                    post({ type: 'aside', open: !prdEmpty && !$('layout').classList.contains('right-closed') });
                const cache = orders[stateId];
                let rows;
                if (cache) {
                    const pos = (n) => (cache.map[n.id] ?? 1e9);
                    const byPos = (a, b) => pos(a) - pos(b) || a.number - b.number;
                    rows = [
                        ...notes.filter((n) => !cache.stale.has(n.id)).sort(byPos).map((n) => [n, cache.map[n.id] ?? '–', false]),
                        ...notes.filter((n) => cache.stale.has(n.id)).sort(byPos).map((n) => [n, cache.map[n.id] ?? '–', true]),
                    ];
                } else {
                    rows = notes.slice().sort((a, b) => a.number - b.number).map((n) => [n, n.number, false]);
                }
                const host = $('notes');
                host.replaceChildren();
                for (const [note, num, stale] of rows) {
                    const row = document.createElement('section');
                    row.className = 'note' + (stale ? ' stale' : '') + (note.id === selectedNoteId ? ' selected' : '');
                    row.dataset.noteId = note.id;
                    row.setAttribute('aria-current', String(note.id === selectedNoteId));
                    row.tabIndex = 0;
                    row.setAttribute('aria-label', `标注 ${num}${stale ? '，已失锚' : '，回车定位到原型位置'}`);
                    const no = document.createElement('span');
                    no.className = 'note-no';
                    no.textContent = num;
                    no.setAttribute('aria-hidden', 'true');
                    const customColor = /^#[0-9a-f]{6}$/i.test(note.color || '') ? note.color : null;
                    if (customColor && !stale) { no.style.setProperty('--pin-fill', customColor); no.style.setProperty('--pin-ink', 'var(--pin-custom-ink)'); }
                    if (stale) row.title = '标注已失锚：原型中找不到对应元素';
                    const body = document.createElement('div');
                    body.className = 'markdown';
                    body.innerHTML = md(note.body || '');
                    const head = document.createElement('div');
                    head.className = 'note-head';
                    head.append(no);
                    row.append(head, body);
                    if (!stale) {
                        row.onclick = () => reveal(note);
                        row.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); reveal(note); } };
                    }
                    host.append(row);
                }
            }

            // ---------- 启动 ----------
            if (!data?.pages?.length) {
                $('empty').textContent = '评审数据缺失或无效，请重新发布。';
            } else {
                $('project').textContent = data.name || '原型项目';
                document.title = `${data.name || '原型项目'} · 原型评审`;
                $('generated').textContent = data.publishedAt ? '发布于 ' + String(data.publishedAt).slice(0, 19).replace('T', ' ') : '';
                buildTree();
                const params = new URLSearchParams(location.hash.slice(1));
                const page = data.pages.find((p) => p.id === (pendingPublicationTarget?.pageId || params.get('p'))) || ProtoProjectNavigation.defaultPage(data);
                const stateId = page.states?.some((s) => s.id === params.get('s')) ? params.get('s') : (page.states?.[0]?.id || 'default');
                selectPage(page, stateId);
                PublicationUpdates.mountPublished({data,onLocate:locatePublicationTarget});
            }
            const pageNavSizer = ProtoSidebarResize.attach($('page-nav-resizer'), {
                storageKey: 'prototype-page-nav-width', isOpen: () => !$('layout').classList.contains('left-closed'),
                getMax: () => $('layout').clientWidth - document.querySelector('aside').getBoundingClientRect().width - 240,
                setWidth: width => $('layout').style.setProperty('--page-nav-width', width + 'px')
            });
            $('toggle-pages').onclick = () => { $('layout').classList.toggle('left-closed'); pageNavSizer.refresh(); };
            /* PRD 宽度：拖拽调节 + localStorage 记忆；收起时清除内联宽度让 --right 归 0。 */
            const PRD_KEY = 'proto-review-prd-width';
            const applyPrdWidth = () => {
                const w = parseInt(localStorage.getItem(PRD_KEY) || '0', 10);
                if (w >= 280) $('layout').style.setProperty('--right', Math.min(w, 720) + 'px');
            };
            applyPrdWidth();
            $('toggle-prd').onclick = () => {
                const closed = $('layout').classList.toggle('right-closed');
                $('toggle-prd').textContent = closed ? '显示 PRD' : '收起 PRD';
                if (closed) $('layout').style.removeProperty('--right');
                else applyPrdWidth();
                pageNavSizer.refresh();
                post({ type: 'aside', open: !closed });
                // 与 viewer 同源（约定 11/12）：收起态开的序号 popover，展开右栏时迁移为右栏定位——关 popover + 行首定位 + 高亮。
                if (!closed) {
                    let openPopId = null;
                    try { openPopId = frame.contentWindow?.__reviewPopNoteId?.(); } catch (_) { /* 未握手 */ }
                    if (openPopId) { try { frame.contentWindow?.__reviewHidePop?.(); } catch (_) { /* 未握手 */ } onPinFocus(openPopId); }
                }
            };
            const prdResizer = $('prd-resizer');
            prdResizer.addEventListener('pointerdown', (e) => {
                if ($('layout').classList.contains('right-closed')) return;
                e.preventDefault();
                prdResizer.setPointerCapture(e.pointerId);
                prdResizer.classList.add('resizing');
                const startX = e.clientX, startWidth = document.querySelector('aside').offsetWidth;
                const move = (ev) => $('layout').style.setProperty('--right', Math.max(280, Math.min(startWidth + (startX - ev.clientX), 720)) + 'px');
                const up = () => {
                    prdResizer.removeEventListener('pointermove', move);
                    prdResizer.removeEventListener('pointerup', up);
                    prdResizer.classList.remove('resizing');
                    pageNavSizer.refresh();
                    const w = parseInt($('layout').style.getPropertyValue('--right'), 10);
                    if (w >= 280) { try { localStorage.setItem(PRD_KEY, String(w)); } catch (_) { /* 存储异常忽略 */ } }
                };
                prdResizer.addEventListener('pointermove', move);
                prdResizer.addEventListener('pointerup', up);
            });
        </script>
    </body>
</html>
